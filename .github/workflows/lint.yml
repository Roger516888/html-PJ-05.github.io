name: 詞庫檢查

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 檢查詞庫
        run: python3 scripts/lint.py

      - name: 測試新增、刪除、批示與查詢
        run: python3 -m unittest discover -s tests -v
