name: lint

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 檢查 TSV 分隔符為 tab
        run: |
          status=0
          for f in terms.tsv rejected.tsv; do
            while IFS=: read -r n line; do
              [ -n "$n" ] || continue
              echo "::error file=$f,line=$n::本行不含 tab，分隔符可能已被轉成空白"
              status=1
            done < <(grep -nP '^[^\t]+$' "$f" || true)
          done
          exit $status

      - name: 四項檢查
        run: python3 scripts/lint.py

      - name: lint 回歸測試
        run: python3 -m unittest discover -s tests -v
