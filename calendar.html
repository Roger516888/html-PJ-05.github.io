<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>動態日曆</title>
    <link rel="stylesheet" href="calendar.css">
</head>
<body>
    <div class="phone">
        <!-- 動態島：平常顯示月份與時間，點日期時展開顯示當天資訊 -->
        <div class="island-zone">
            <div id="island" class="island" role="button" tabindex="0" aria-expanded="false" aria-label="動態島，點一下顯示所選日期的資訊">
                <div class="island-compact">
                    <span id="island-month" class="island-month"></span>
                    <span class="island-right">
                        <span class="live-dot"></span>
                        <span id="island-clock" class="island-clock"></span>
                    </span>
                </div>
                <div id="island-detail" class="island-detail"></div>
            </div>
        </div>
        <p id="sr-status" class="sr-only" aria-live="polite"></p>

        <div class="weekdays" aria-hidden="true">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="weekend">六</span><span class="weekend">日</span>
        </div>

        <section id="cal" class="cal" aria-label="月曆，上下滑動切換月份">
            <div id="grid" class="grid"></div>
        </section>
        <p id="holiday-status" class="holiday-status" hidden></p>

        <section class="agenda" aria-label="當日行程">
            <div id="agenda-date" class="agenda-date"></div>
            <div id="agenda-sub" class="agenda-sub"></div>
            <ul id="agenda-list" class="agenda-list"></ul>
        </section>

        <!-- 功能列 -->
        <nav class="dock" aria-label="功能列">
            <button id="btn-today" class="dock-btn" type="button">
                <span class="dock-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" class="fill"/></svg>
                </span>
                <span class="dock-label">今天</span>
            </button>
            <button id="btn-add" class="dock-btn primary" type="button">
                <span class="dock-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </span>
                <span class="dock-label">新增</span>
            </button>
            <button id="btn-list" class="dock-btn" type="button">
                <span class="dock-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" class="fill"/><circle cx="4.5" cy="12" r="1.2" class="fill"/><circle cx="4.5" cy="18" r="1.2" class="fill"/></svg>
                </span>
                <span class="dock-label">行程</span>
            </button>
            <button id="btn-theme" class="dock-btn" type="button">
                <span class="dock-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-moon"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
                    <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
                </span>
                <span class="dock-label">外觀</span>
            </button>
        </nav>
    </div>

    <!-- 新增行程 -->
    <dialog id="add-sheet" class="sheet" aria-labelledby="add-title">
        <form id="add-form" class="sheet-inner" autocomplete="off">
            <div class="sheet-grip"></div>
            <h2 id="add-title" class="sheet-title">新增行程</h2>
            <input id="ev-title" class="field" type="text" placeholder="行程名稱，例如：開會" maxlength="40" required autofocus>
            <input id="ev-time" class="field" type="time" aria-label="時間（可不填）">
            <div class="color-picks" role="radiogroup" aria-label="分類">
                <label><input type="radio" name="color" value="blue" checked><span class="swatch c-blue"></span>工作</label>
                <label><input type="radio" name="color" value="green"><span class="swatch c-green"></span>個人</label>
                <label><input type="radio" name="color" value="orange"><span class="swatch c-orange"></span>提醒</label>
                <label><input type="radio" name="color" value="red"><span class="swatch c-red"></span>重要</label>
                <label><input type="radio" name="color" value="purple"><span class="swatch c-purple"></span>其他</label>
            </div>
            <div class="sheet-actions">
                <button type="button" class="btn-ghost" data-close>取消</button>
                <button type="submit" class="btn-primary">儲存</button>
            </div>
        </form>
    </dialog>

    <!-- 即將到來的行程 -->
    <dialog id="list-sheet" class="sheet" aria-labelledby="list-title">
        <div class="sheet-inner">
            <div class="sheet-grip"></div>
            <h2 id="list-title" class="sheet-title">即將到來的行程</h2>
            <ul id="upcoming-list" class="upcoming-list"></ul>
            <div class="sheet-actions">
                <button type="button" class="btn-ghost" data-close>關閉</button>
            </div>
        </div>
    </dialog>

    <script src="calendar.js"></script>
</body>
</html>
