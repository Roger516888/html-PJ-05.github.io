<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>採購時程日曆</title>
    <link rel="stylesheet" href="calendar.css">
</head>
<body>
    <main class="sheet">
        <header class="doc-head">
            <input id="doc-title" class="doc-title" type="text" placeholder="輸入案名，例如：OOO 系統採購案" maxlength="80" aria-label="案名">
            <textarea id="doc-note" class="doc-note" rows="1" placeholder="備註（可不填）" maxlength="2000" aria-label="備註"></textarea>
            <p id="doc-meta" class="doc-meta"></p>
        </header>

        <!-- 動態島：各節點日期一覽，點節點切換要設定的對象 -->
        <section id="island" class="island" aria-label="時程摘要">
            <div class="island-top">
                <span class="live-dot" aria-hidden="true"></span>
                <span>點日期設定為</span>
                <strong id="active-name" class="active-name"></strong>
                <span class="island-tip">（點下方節點可切換）</span>
            </div>
            <ol id="chips" class="chips"></ol>
            <p id="readout" class="readout" aria-live="polite"></p>
        </section>

        <!-- 列印用：時程摘要表 -->
        <table class="summary print-only">
            <thead>
                <tr><th>節點</th><th>日期</th><th>計算方式</th><th>期間</th></tr>
            </thead>
            <tbody id="summary-body"></tbody>
        </table>

        <table class="strip" aria-label="連續週曆">
            <thead>
                <tr>
                    <th class="month-col">月份</th>
                    <th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th class="weekend">六</th><th class="weekend">日</th>
                </tr>
            </thead>
            <tbody id="weeks"></tbody>
        </table>

        <p id="foot-note" class="foot-note"></p>
    </main>

    <!-- 功能列 -->
    <nav class="toolbar" aria-label="功能列">
        <button id="btn-today" class="tool" type="button">
            <span class="tool-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" class="fill"/></svg></span>
            <span class="tool-label">今天</span>
        </button>
        <button id="btn-undo" class="tool" type="button">
            <span class="tool-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7L4.5 11.5 9 16"/><path d="M5 11.5h9.5a5 5 0 0 1 0 10H11"/></svg></span>
            <span class="tool-label">復原</span>
        </button>
        <button id="btn-settings" class="tool primary" type="button">
            <span class="tool-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></span>
            <span class="tool-label">流程設定</span>
        </button>
        <button id="btn-print" class="tool" type="button">
            <span class="tool-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="8" rx="2"/><path d="M7 14h10v6.5H7z"/></svg></span>
            <span class="tool-label">列印</span>
        </button>
    </nav>

    <!-- 流程設定 -->
    <dialog id="settings" class="panel" aria-labelledby="settings-title">
        <form id="settings-form" class="panel-inner" method="dialog">
            <h2 id="settings-title" class="panel-title">流程設定</h2>
            <fieldset class="rule-set">
                <legend>天數起算方式</legend>
                <label><input type="radio" name="startRule" value="next"> 次日起算（始日不算入，民法第 120 條）</label>
                <label><input type="radio" name="startRule" value="same"> 當日起算（起始日算第 1 天）</label>
            </fieldset>
            <div class="steps-wrap">
                <table class="steps">
                    <thead>
                        <tr><th>節點名稱</th><th>與前一節點相隔</th><th>遇假日順延</th><th>日期</th><th><span class="sr-only">刪除</span></th></tr>
                    </thead>
                    <tbody id="steps-body"></tbody>
                </table>
            </div>
            <p class="panel-hint">改「日期」會以該節點為基準重新推算其他節點；工作天會扣除週末與國定假日。</p>
            <div class="panel-actions">
                <button id="add-step" class="btn" type="button">＋ 新增節點</button>
                <button id="reset-steps" class="btn" type="button">恢復預設流程</button>
                <button class="btn primary" type="submit">完成</button>
            </div>
        </form>
    </dialog>

    <script src="calendar.js"></script>
</body>
</html>
