<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">自動排班工具 - 5月班表</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="lang-switcher">
            <label data-i18n="language">語言：</label>
            <button type="button" data-lang="zh-TW" class="lang-btn active">繁體中文</button>
            <button type="button" data-lang="zh-CN" class="lang-btn">简体中文</button>
            <button type="button" data-lang="en" class="lang-btn">English</button>
        </div>
        <h1 data-i18n="heading">自動排班工具 - 2025年5月班表</h1>
        <button id="generate-btn" data-i18n="generate">生成班表</button>
        <div id="schedule-output"></div>
        <div id="stats-output"></div>
        <div id="self-check-output"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
